<!DOCTYPE html>
<html lang="en">

<!-- Interstitial means “in between.” a screen that appears between two other screens or actions. -->

<head>
    <meta charset="UTF-8">
    <title>Open App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background: #f0f2f5;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 0 1rem;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
        }

        .btn:hover {
            background-color: #0056b3;
        }
    </style>

    <script>
        // JavaScript onLoad script
        document.addEventListener('DOMContentLoaded', function () {
            console.log('Preview page loaded successfully');

            try {
                // Initialize page functionality
                initializePage();

                // Add click event listener to the button
                const button = document.querySelector('.btn');
                if (button) {
                    button.addEventListener('click', function (e) {
                        console.log('Button clicked, redirecting to:', this.href);
                        // You can add analytics tracking here
                        trackButtonClick();
                    });
                }

                // Log page load analytics
                trackPageLoad();

            } catch (error) {
                console.error('Error during page initialization:', error);
            }
        });

        function initializePage() {
            // Page initialization logic
            console.log('Loading dynamic link...');
            const redirectLink = "{{.RedirectLink}}";
            // Add 3 second delay before redirecting
            setTimeout(function () {
                console.log('3 second delay completed, redirecting to:', redirectLink);
                document.getElementById('redirect-btn').click();
            }, 3000);
        }

        function trackButtonClick() {
            // Analytics tracking for button clicks
            console.log('Button click tracked');
            // Add your analytics code here (e.g., Google Analytics, custom tracking)
        }

        function trackPageLoad() {
            // Analytics tracking for page loads
            console.log('Page load tracked');
            // Add your analytics code here (e.g., Google Analytics, custom tracking)
        }

        // Additional window load event for resources like images
        window.addEventListener('load', function () {
            console.log('All page resources loaded');
        });
    </script>
</head>

<body>
    <h1>Open this link in the app</h1>
    <h3>Preview</h3>
    <a id="redirect-btn" href="{{.RedirectLink}}" class="btn">{{.ButtonText}}</a>
</body>

</html>
